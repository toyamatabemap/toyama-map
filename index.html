<script>
/* =====================================================
   1. Firebase設定
===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyCokjVZVcnwDt1inWLUCfoDnPzQ7M5Y-G4",
  authDomain: "toyamap-dcb68.firebaseapp.com",
  projectId: "toyamap-dcb68",
  storageBucket: "toyamap-dcb68.firebasestorage.app",
  messagingSenderId: "502642575813",
  appId: "1:502642575813:web:c7e9fa0050e074d3c6e3ac"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let likeCounts = {};
let myLikes = {};

let likesUnsubscribe = null;
let myLikesUnsubscribe = null;

let spotsData = [];
let currentFilterCat = 'all';
let currentSearchVal = '';
let currentSortMode = 'default';

let markerGroup = L.layerGroup();
let openPopupSpotName = null;
let userMarker = null;
let userLatLng = null;
let pendingLikes = new Set();

const sheet = document.getElementById('bottomSheet');
const dragHeader = document.getElementById('dragHeader');

let currentMode = 'min';

/* =====================================================
   2. Firebase匿名認証
===================================================== */

auth.onAuthStateChanged(async user => {
  try {
    if (!user) {
      await auth.signInAnonymously();
      return;
    }

    currentUser = user;

    document.getElementById('authStatus').textContent =
      '☁️ クラウド同期中';

    startFirestoreListeners();

  } catch (error) {
    console.error('Authentication Error:', error);

    document.getElementById('authStatus').textContent =
      '同期エラー：Firebase設定を確認してください';
  }
});

/* =====================================================
   3. Firestoreリアルタイム監視
===================================================== */

function startFirestoreListeners() {

  if (!currentUser) return;

  if (likesUnsubscribe) likesUnsubscribe();
  if (myLikesUnsubscribe) myLikesUnsubscribe();

  // 全員共通の店舗別いいね数
  likesUnsubscribe = db.collection('likes')
    .onSnapshot(snapshot => {

      const newCounts = {};

      snapshot.forEach(doc => {
        const data = doc.data();
        const name = data.spotName;

        if (name) {
          newCounts[name] = Math.max(
            0,
            Number(data.count) || 0
          );
        }
      });

      likeCounts = newCounts;

      applyFilterAndDraw();

    }, error => {
      console.error('Likes Listener Error:', error);
    });

  // 自分がいいねした店舗の一覧
  myLikesUnsubscribe = db
    .collection('userLikes')
    .doc(currentUser.uid)
    .collection('spots')
    .onSnapshot(snapshot => {

      const newMyLikes = {};

      snapshot.forEach(doc => {
        newMyLikes[doc.id] = true;
      });

      myLikes = newMyLikes;

      applyFilterAndDraw();

    }, error => {
      console.error('User Likes Listener Error:', error);
    });
}

/* =====================================================
   4. いいね機能
   店舗ごとに個別管理
   Firestore Transactionで同時更新にも対応
===================================================== */

function getSpotDocId(spotName) {
  return encodeURIComponent(spotName);
}

async function toggleLike(spotName, event) {

  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  if (!currentUser) {
    alert('データを接続中です。少し待ってから押してください。');
    return;
  }

  if (pendingLikes.has(spotName)) return;

  pendingLikes.add(spotName);

  const spotId = getSpotDocId(spotName);

  const likeRef = db.collection('likes').doc(spotId);

  const userLikeRef = db
    .collection('userLikes')
    .doc(currentUser.uid)
    .collection('spots')
    .doc(spotId);

  try {

    await db.runTransaction(async transaction => {

      // 必ず書き込み前に両方を読み込む
      const userLikeDoc = await transaction.get(userLikeRef);
      const likeDoc = await transaction.get(likeRef);

      const currentCount = likeDoc.exists
        ? Math.max(0, Number(likeDoc.data().count) || 0)
        : 0;

      if (userLikeDoc.exists) {

        // すでにいいね済みなら解除
        transaction.delete(userLikeRef);

        transaction.set(likeRef, {
          spotName: spotName,
          count: Math.max(0, currentCount - 1)
        }, { merge: true });

      } else {

        // まだいいねしていなければ追加
        transaction.set(userLikeRef, {
          spotName: spotName,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        transaction.set(likeRef, {
          spotName: spotName,
          count: currentCount + 1
        }, { merge: true });

      }

    });

  } catch (error) {

    console.error('Like Transaction Error:', error);

    alert(
      'いいねを保存できませんでした。\n' +
      'FirebaseのAuthenticationとFirestoreルールを確認してください。'
    );

  } finally {

    pendingLikes.delete(spotName);

  }
}

/* =====================================================
   5. マップ初期化
===================================================== */

const myMap = L.map('map', {
  zoomControl: false,
  tap: true,
  dragging: true
}).setView([36.6953, 137.2113], 11);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }
).addTo(myMap);

L.control.attribution({
  position: 'topleft'
}).addTo(myMap);

markerGroup.addTo(myMap);

/* =====================================================
   6. Googleスプレッドシート読み込み
===================================================== */

const csvUrl =
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXXOH9pKDeiSNg8G0FJcKKmH7Ttio5iq10frKSvzUISdVlGLUt0k301QfhnFfxoJmdQFkvdo5d520s/pub?output=csv';

/* =====================================================
   7. 共通処理
===================================================== */

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function processImageUrl(rawUrl, fallbackPostUrl) {

  let url = rawUrl || fallbackPostUrl || '';

  if (url.includes('drive.google.com')) {

    const matches = url.match(/\/d\/([a-zA-Z0-9_-]+)/);

    if (matches && matches[1]) {
      return `https://drive.google.com/uc?export=view&id=${matches[1]}`;
    }
  }

  if (
    url.includes('instagram.com/p/') ||
    url.includes('instagram.com/reel/')
  ) {
    const cleanUrl = url.split('?')[0].replace(/\/$/, '');
    return `${cleanUrl}/media/?size=l`;
  }

  return url;
}

function getCategoryStyle(cat) {

  if (!cat) return { color:'#F97316', emoji:'😋' };

  const styles = [
    ['ラーメン','#EF4444','🍜'],
    ['カレー','#D97706','🍛'],
    ['肉ご飯','#DC2626','🥩'],
    ['魚ご飯','#0284C7','🐟'],
    ['洋食','#F59E0B','🍳'],
    ['中華','#EA580C','🥟'],
    ['和食','#16A34A','🍱'],
    ['ランチ','#EAB308','🍱'],
    ['カフェ','#B45309','☕'],
    ['ケーキ屋','#EC4899','🍰'],
    ['和菓子屋','#84CC16','🍡'],
    ['軽食','#14B8A6','🥪'],
    ['バー','#4C1D95','🍸'],
    ['居酒屋','#B91C1C','🍻'],
    ['ドライブ','#7C3AED','🚗'],
    ['食べ放題','#059669','🍽️']
  ];

  for (const [key,color,emoji] of styles) {
    if (cat.includes(key)) return {color,emoji};
  }

  return {color:'#F97316',emoji:'🍴'};
}

function calculateRawDistance(lat1, lon1, lat2, lon2) {

  const R = 6371;

  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return R * 2 * Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function formatDistanceText(km) {
  return km < 1
    ? `${Math.round(km*1000)}m`
    : `${km.toFixed(1)}km`;
}

/* =====================================================
   8. CSV読み込み
===================================================== */

Papa.parse(csvUrl, {

  download: true,
  header: true,
  skipEmptyLines: true,

  complete: function(res) {

    try {

      spotsData = res.data.map((row, idx) => {

        const name =
          row['name'] ||
          row['名称'] ||
          row['名前'] ||
          '';

        if (!name) return null;

        const kw =
          row['instaKeyword'] ||
          row['instaKetword'] ||
          row['ハッシュタグ'] ||
          name;

        const postUrl =
          row['postUrl'] ||
          row['postURL'] ||
          row['投稿URL'] ||
          row['link'] ||
          'https://www.instagram.com/onakaguguchan/';

        let img = processImageUrl(
          row['image'] || row['image_url'] || row['画像'] || '',
          postUrl
        );

        if (
          !img ||
          img === 'https://www.instagram.com/onakaguguchan/'
        ) {
          img =
            'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&auto=format&fit=crop';
        }

        let gmap =
          row['googleMap'] ||
          row['google_map'] ||
          row['Googleマップ'] ||
          '';

        if (!gmap) {
          gmap =
            `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' 富山')}`;
        }

        const rawLat = String(
          row['lat'] || row['緯度'] || ''
        ).replace(/[^\d.-]/g,'');

        const rawLng = String(
          row['lng'] || row['経度'] || ''
        ).replace(/[^\d.-]/g,'');

        const lat = parseFloat(rawLat);
        const lng = parseFloat(rawLng);

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
          return null;
        }

        return {
          id: idx,
          name,
          desc:
            row['description'] ||
            row['詳細'] ||
            row['説明'] ||
            'おいしい噂を聞きつけて調査中！',
          category: row['category'] || row['カテゴリ'] || 'グルメ',
          instaKw: String(kw).trim(),
          gmapUrl: gmap,
          postUrl,
          imgUrl: img,
          lat,
          lng
        };

      }).filter(Boolean);

      applyFilterAndDraw();

    } catch(error) {

      console.error('CSV Error:',error);

      document.getElementById('spotList').innerHTML =
        '<p class="text-red-500 text-center text-xs">店舗データの読み込みに失敗しました。</p>';

    }
  },

  error: function(error) {

    console.error('CSV Download Error:',error);

    document.getElementById('spotList').innerHTML =
      '<p class="text-red-500 text-center text-xs">データを読み込めませんでした。</p>';

  }

});

/* =====================================================
   9. 検索・カテゴリ・並び替え
===================================================== */

function applyFilterAndDraw() {

  let result = [...spotsData];

  if (currentSearchVal) {

    const query = currentSearchVal.trim().toLowerCase();

    result = result.filter(s => {

      const categories = s.category.toLowerCase();

      return (
        s.name.toLowerCase().includes(query) ||
        s.instaKw.toLowerCase().includes(query) ||
        s.desc.toLowerCase().includes(query) ||
        categories.includes(query)
      );

    });
  }

  if (currentFilterCat !== 'all') {
    result = result.filter(s =>
      s.category.includes(currentFilterCat)
    );
  }

  if (currentSortMode === 'distance' && userLatLng) {

    result.sort((a,b) => {

      const da = calculateRawDistance(
        userLatLng.lat,userLatLng.lng,a.lat,a.lng
      );

      const dbb = calculateRawDistance(
        userLatLng.lat,userLatLng.lng,b.lat,b.lng
      );

      return da-dbb;

    });

  } else if (currentSortMode === 'likes') {

    result.sort((a,b) => {
      return (likeCounts[b.name] || 0) -
             (likeCounts[a.name] || 0);
    });

  }

  drawMarkers(result);
}

function filterCategory(cat, button) {

  currentFilterCat = cat;

  document.querySelectorAll('.cat-btn').forEach(b => {
    b.className =
      'cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-3 py-1 rounded-full whitespace-nowrap';
  });

  button.className =
    'cat-btn bg-orange-500 text-white font-black px-3 py-1 rounded-full whitespace-nowrap';

  applyFilterAndDraw();
}

function setSortMode(mode, button) {

  if (mode === 'distance' && !userLatLng) {
    alert('先に現在地を取得してください！');
    return;
  }

  currentSortMode = mode;

  document.querySelectorAll('.sort-btn').forEach(b => {
    b.className =
      'sort-btn bg-amber-100 text-amber-900 font-bold px-2.5 py-1 rounded-md';
  });

  button.className =
    'sort-btn bg-orange-500 text-white font-black px-2.5 py-1 rounded-md';

  applyFilterAndDraw();
}

document.getElementById('searchInput')
  .addEventListener('input',e => {

    currentSearchVal = e.target.value.toLowerCase();
    applyFilterAndDraw();

  });

/* =====================================================
   10. 店舗一覧・マーカー描画
===================================================== */

function drawMarkers(data) {

  markerGroup.clearLayers();

  const listEl = document.getElementById('spotList');
  listEl.innerHTML = '';

  if (!data.length) {

    listEl.innerHTML =
      '<p class="text-orange-800/60 font-bold text-center py-5 text-xs">お店が見つからなかった！</p>';

    return;
  }

  let activeMarkerToReopen = null;

  data.forEach(s => {

    const name = escapeHtml(s.name);
    const desc = escapeHtml(s.desc);
    const category = escapeHtml(s.category);

    const catStyle = getCategoryStyle(s.category);

    const count = likeCounts[s.name] || 0;
    const isLiked = !!myLikes[getSpotDocId(s.name)];

    const image = escapeHtml(s.imgUrl);
    const postUrl = escapeHtml(s.postUrl);
    const gmapUrl = escapeHtml(s.gmapUrl);

    const instaSearchUrl =
      `https://www.instagram.com/explore/tags/${encodeURIComponent(s.instaKw)}/`;

    let distText = '';

    if (userLatLng) {

      const km = calculateRawDistance(
        userLatLng.lat,
        userLatLng.lng,
        s.lat,
        s.lng
      );

      distText = `📍 現在地から ${formatDistanceText(km)}`;
    }

    const likedClass = isLiked
      ? 'bg-red-500 text-white'
      : 'bg-gray-100 text-gray-700';

    const heartClass = isLiked
      ? 'text-white'
      : 'text-red-500';

    const popupContent = `
      <div class="bg-white rounded-xl overflow-hidden">

        <div class="relative w-full aspect-[4/3] bg-gray-900 overflow-hidden">

          <img src="${image}"
            class="w-full h-full object-cover"
            onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400'">

          <span class="absolute top-2 left-2 text-[10px] font-black px-2 py-1 rounded-full text-white shadow-md"
            style="background:${catStyle.color}">
            ${catStyle.emoji} ${category}
          </span>

          <button onclick="closeMyPopup()"
            class="absolute top-2 right-2 w-7 h-7 bg-red-600 text-white rounded-full shadow font-black">
            ✕
          </button>

        </div>

        <div class="p-3 space-y-2">

          <div class="flex items-center justify-between gap-2">

            <h3 class="font-black text-gray-900 text-sm flex-1">
              ${name}
            </h3>

            <button
              onclick="toggleLike(${JSON.stringify(s.name)},event)"
              class="like-btn ${likedClass}">
              <i class="fa-solid fa-heart ${heartClass}"></i>
              ${count}
            </button>

          </div>

          ${distText ? `
            <p class="text-[10px] text-orange-600 font-extrabold">
              ${distText}
            </p>
          ` : ''}

          <p class="text-[11px] text-gray-800 leading-relaxed font-bold bg-amber-50 p-2 rounded-lg">
            💬 ${desc}
          </p>

          <a href="${postUrl}" target="_blank" rel="noopener noreferrer"
            class="action-btn post-btn">
            <i class="fa-brands fa-instagram"></i>
            Instagram投稿を見る
          </a>

          <div class="grid grid-cols-2 gap-2">

            <a href="${instaSearchUrl}" target="_blank" rel="noopener noreferrer"
              class="action-btn insta-btn">
              <i class="fa-solid fa-hashtag"></i>
              みんなの投稿
            </a>

            <a href="${gmapUrl}" target="_blank" rel="noopener noreferrer"
              class="action-btn map-btn">
              <i class="fa-solid fa-map-location-dot"></i>
              Google Map
            </a>

          </div>

        </div>
      </div>
    `;

    const foodPinIcon = L.divIcon({

      className:'custom-pin-wrapper',

      html:`
        <div class="custom-food-pin"
          style="background-color:${catStyle.color}">
          ${catStyle.emoji}
        </div>
      `,

      iconSize:[28,28],
      iconAnchor:[14,14],
      popupAnchor:[0,-12]

    });

    const marker = L.marker(
      [s.lat,s.lng],
      {icon:foodPinIcon}
    ).bindPopup(popupContent,{
      autoPan:true,
      autoPanPadding:[50,50]
    });

    marker.on('popupopen',() => {
      openPopupSpotName = s.name;
    });

    if (openPopupSpotName === s.name) {
      activeMarkerToReopen = marker;
    }

    markerGroup.addLayer(marker);

    // 店舗カード
    const card = document.createElement('div');

    card.className =
      'bg-white p-2 border-2 border-orange-100 rounded-xl hover:border-orange-300 transition cursor-pointer flex gap-2 items-center relative overflow-hidden';

    card.innerHTML = `

      <div class="w-14 aspect-[3/4] bg-slate-900 rounded-lg overflow-hidden flex-shrink-0">
        <img src="${image}"
          loading="lazy"
          class="w-full h-full object-cover"
          onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400'">
      </div>

      <div class="flex-1 min-w-0">

        <div class="flex justify-between items-start gap-1">

          <h4 class="font-black text-gray-800 text-xs truncate flex-1">
            ${name}
          </h4>

          <span class="text-[9px] font-black px-1.5 py-0.5 rounded-full text-white whitespace-nowrap"
            style="background:${catStyle.color}">
            ${catStyle.emoji} ${category}
          </span>

        </div>

        <p class="text-[10px] text-gray-500 font-bold truncate mt-1">
          ${desc}
        </p>

        <div class="flex items-center justify-between mt-2">

          <span class="text-[9px] font-black text-orange-600">
            ${distText}
          </span>

          <button
            class="like-btn ${likedClass}"
            onclick="toggleLike(${JSON.stringify(s.name)},event)">
            <i class="fa-solid fa-heart ${heartClass}"></i>
            ${count}
          </button>

        </div>

      </div>
    `;

    card.addEventListener('click',() => {

      myMap.invalidateSize();

      myMap.setView(
        [s.lat,s.lng],
        15,
        {animate:true}
      );

      setTimeout(() => {

        openPopupSpotName = s.name;
        marker.openPopup();

      },400);

      if (window.innerWidth < 768) {

        sheet.style.height = '90px';
        currentMode = 'min';

        setTimeout(() => myMap.invalidateSize(),250);
      }

    });

    listEl.appendChild(card);

  });

  if (activeMarkerToReopen) {
    activeMarkerToReopen.openPopup();
  }
}

/* =====================================================
   11. ポップアップ
===================================================== */

function closeMyPopup() {

  openPopupSpotName = null;
  myMap.closePopup();

}

/* =====================================================
   12. 現在地
===================================================== */

function getLocation() {

  myMap.locate({
    setView:true,
    maxZoom:15
  });

}

myMap.on('locationfound',e => {

  userLatLng = e.latlng;

  if (userMarker) {
    myMap.removeLayer(userMarker);
  }

  const userIcon = L.divIcon({

    html:`
      <div class="w-7 h-7 rounded-full bg-red-500 border-2 border-white shadow-lg flex items-center justify-center text-white text-xs">
        📍
      </div>
    `,

    iconSize:[28,28],
    iconAnchor:[14,14]

  });

  userMarker = L.marker(
    e.latlng,
    {icon:userIcon}
  ).addTo(myMap).bindPopup(
    '<b class="text-xs font-black">📍 現在地</b>'
  );

  currentSortMode = 'distance';

  const buttons = document.querySelectorAll('.sort-btn');

  buttons.forEach(b => {
    b.className =
      'sort-btn bg-amber-100 text-amber-900 font-bold px-2.5 py-1 rounded-md';
  });

  buttons[1].className =
    'sort-btn bg-orange-500 text-white font-black px-2.5 py-1 rounded-md';

  applyFilterAndDraw();

});

myMap.on('locationerror',() => {

  alert('現在地を取得できませんでした。スマホの位置情報を許可してください！');

});

/* =====================================================
   13. ボトムシートのスワイプ
===================================================== */

let startY = 0;
let startHeight = 0;

dragHeader.addEventListener('touchstart',e => {

  startY = e.touches[0].clientY;
  startHeight = sheet.offsetHeight;
  sheet.style.transition = 'none';

},{passive:true});

dragHeader.addEventListener('touchmove',e => {

  const currentY = e.touches[0].clientY;
  const deltaY = startY-currentY;

  const newHeight = startHeight+deltaY;

  if (
    newHeight >= 90 &&
    newHeight <= window.innerHeight*.85
  ) {
    sheet.style.height = `${newHeight}px`;
  }

},{passive:true});

dragHeader.addEventListener('touchend',() => {

  sheet.style.transition = 'height .25s ease-out';

  const height = sheet.offsetHeight;

  if (height < 180) {

    sheet.style.height = '90px';
    currentMode = 'min';

  } else if (height < window.innerHeight*.55) {

    sheet.style.height = '50vh';
    currentMode = 'mid';

  } else {

    sheet.style.height = '85vh';
    currentMode = 'max';

  }

  setTimeout(() => myMap.invalidateSize(),250);

});

dragHeader.addEventListener('click',() => {

  sheet.style.transition = 'height .25s ease-out';

  if (currentMode === 'min') {

    sheet.style.height = '50vh';
    currentMode = 'mid';

  } else if (currentMode === 'mid') {

    sheet.style.height = '85vh';
    currentMode = 'max';

  } else {

    sheet.style.height = '90px';
    currentMode = 'min';

  }

  setTimeout(() => myMap.invalidateSize(),250);

});

</script>
