<div class="p-2 text-[9px] text-gray-400 text-center border-t border-amber-100 bg-white leading-tight flex-shrink-0" style="padding-bottom:max(.5rem,env(safe-area-inset-bottom))">

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
const firebaseConfig = {
apiKey:"AIzaSyCokjVZVcnwDt1inWLUCfoDnPzQ7M5Y-G4",
authDomain:"toyamap-dcb68.firebaseapp.com",
projectId:"toyamap-dcb68",
storageBucket:"toyamap-dcb68.firebasestorage.app",
messagingSenderId:"502642575813",
appId:"1:502642575813:web:c7e9fa0050e074d3c6e3ac"
};

let db=null;
let auth=null;
let currentUser=null;
let likesUnsubscribe=null;
let myLikesUnsubscribe=null;
let likeCounts={};
let myLikedSpots={};

try{
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
db=firebase.firestore();
auth=firebase.auth();
}catch(e){
console.error("Firebase初期化エラー",e);
}

const myMap=L.map('map',{zoomControl:false,tap:true,dragging:true}).setView([36.6953,137.2113],11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
}).addTo(myMap);

myMap.attributionControl.setPosition('topleft');

const csvUrl='https://docs.google.com/spreadsheets/d/e/2PACX-1vSXXOH9pKDeiSNg8G0FJcKKmH7Ttio5iq10frKSvzUISdVlGLUt0k301QfhnFfxoJmdQFkvdo5d520s/pub?output=csv';

let spotsData=[];
let currentFilterCat='all';
let currentSearchVal='';
let currentSortMode='default';
let markerGroup=L.layerGroup().addTo(myMap);
let openPopupSpotName=null;
let userMarker=null;
let userLatLng=null;

const sheet=document.getElementById('bottomSheet');
const dragHeader=document.getElementById('dragHeader');
let startY=0,startHeight=0,currentMode='min';

dragHeader.addEventListener('touchstart',e=>{
startY=e.touches[0].clientY;
startHeight=sheet.offsetHeight;
sheet.style.transition='none';
},{passive:true});

dragHeader.addEventListener('touchmove',e=>{
const newHeight=startHeight+(startY-e.touches[0].clientY);
if(newHeight>=90&&newHeight<=window.innerHeight*.85) sheet.style.height=newHeight+'px';
},{passive:true});

dragHeader.addEventListener('touchend',()=>{
sheet.style.transition='height .25s ease-out';
const h=sheet.offsetHeight;
if(h<180){sheet.style.height='90px';currentMode='min'}
else if(h<window.innerHeight*.55){sheet.style.height='50vh';currentMode='mid'}
else{sheet.style.height='85vh';currentMode='max'}
setTimeout(()=>myMap.invalidateSize(),250);
});

dragHeader.addEventListener('click',()=>{
sheet.style.transition='height .25s ease-out';
if(currentMode==='min'){sheet.style.height='50vh';currentMode='mid'}
else if(currentMode==='mid'){sheet.style.height='85vh';currentMode='max'}
else{sheet.style.height='90px';currentMode='min'}
setTimeout(()=>myMap.invalidateSize(),250);
});

function closeMyPopup(){
openPopupSpotName=null;
myMap.closePopup();
}

function processImageUrl(rawUrl,fallbackPostUrl){
if(!rawUrl) rawUrl=fallbackPostUrl||'';
if(rawUrl.includes('drive.google.com')){
const m=rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
if(m) return `https://drive.google.com/uc?export=view&id=${m[1]}`;
}
if(rawUrl.includes('instagram.com/p/')||rawUrl.includes('instagram.com/reel/')){
return rawUrl.split('?')[0].replace(/\/$/,'')+'/media/?size=l';
}
return rawUrl;
}

function getMyLikes(){return myLikedSpots;}

async function toggleLike(spotName,event){
if(event) event.stopPropagation();
if(!db||!currentUser){
alert('接続準備中です。数秒待ってからもう一度押してください。');
return;
}

const spotId=encodeURIComponent(spotName);
const totalRef=db.collection('likes').doc(spotId);
const userLikeRef=db.collection('userLikes').doc(currentUser.uid).collection('spots').doc(spotId);

try{
await db.runTransaction(async transaction=>{
const userSnap=await transaction.get(userLikeRef);
const totalSnap=await transaction.get(totalRef);

const count=totalSnap.exists?Math.max(0,Number(totalSnap.data().count)||0):0;

if(userSnap.exists){
transaction.delete(userLikeRef);
transaction.set(totalRef,{
spotName:spotName,
count:Math.max(0,count-1)
},{merge:true});
}else{
transaction.set(userLikeRef,{
spotName:spotName,
likedAt:firebase.firestore.FieldValue.serverTimestamp()
});
transaction.set(totalRef,{
spotName:spotName,
count:count+1
},{merge:true});
}
});
}catch(error){
console.error('いいね更新エラー:',error);
alert('いいねを保存できませんでした。Firebaseの設定を確認してください。');
}
}

function startLikesListeners(user){
if(likesUnsubscribe) likesUnsubscribe();
if(myLikesUnsubscribe) myLikesUnsubscribe();

likesUnsubscribe=db.collection('likes').onSnapshot(snapshot=>{
const counts={};
snapshot.forEach(doc=>{
const data=doc.data()||{};
const name=data.spotName||decodeURIComponent(doc.id);
counts[name]=Math.max(0,Number(data.count)||0);
});
likeCounts=counts;
applyFilterAndDraw();
},error=>console.error('全体いいね同期エラー:',error));

myLikedSpots={};
myLikesUnsubscribe=db.collection('userLikes').doc(user.uid).collection('spots').onSnapshot(snapshot=>{
const mine={};
snapshot.forEach(doc=>{
const data=doc.data()||{};
mine[data.spotName||decodeURIComponent(doc.id)]=true;
});
myLikedSpots=mine;
applyFilterAndDraw();
},error=>console.error('個人いいね同期エラー:',error));
}

auth.onAuthStateChanged(async user=>{
try{
if(!user){
await auth.signInAnonymously();
return;
}
currentUser=user;
startLikesListeners(user);
}catch(error){
console.error('匿名認証エラー:',error);
alert('Firebaseの匿名認証を有効にしてください。');
}
});

function getCategoryStyle(cat){
if(!cat)return{color:'#F97316',emoji:'😋'};
const styles=[
['ラーメン','#EF4444','🍜'],['カレー','#D97706','🍛'],
['肉ご飯','#DC2626','🥩'],['魚ご飯','#0284C7','🐟'],
['洋食','#F59E0B','🍳'],['中華','#EA580C','🥟'],
['和食','#16A34A','🍱'],['ランチ','#EAB308','🍱'],
['カフェ','#B45309','☕️'],['ケーキ屋','#EC4899','🍰'],
['和菓子屋','#84CC16','🍡'],['軽食','#14B8A6','🥪'],
['バー','#4C1D95','🍸'],['居酒屋','#B91C1C','🍻'],
['ドライブ','#7C3AED','🚗'],['食べ放題','#059669','🍽️']
];
for(const [key,color,emoji] of styles){
if(cat.includes(key))return{color,emoji};
}
return{color:'#F97316',emoji:'🍴'};
}

function calculateRawDistance(lat1,lon1,lat2,lon2){
const R=6371;
const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;
const a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function formatDistanceText(km){
return km<1?`${Math.round(km*1000)}m`:`${km.toFixed(1)}km`;
}

Papa.parse(csvUrl,{
download:true,header:true,skipEmptyLines:true,
complete:res=>{
try{
spotsData=res.data.map((row,idx)=>{
const name=row.name||row['名称']||row['名前']||'';
if(!name)return null;
const kw=row.instaKeyword||row.instaKetword||row['ハッシュタグ']||name;
const postUrl=row.postUrl||row.postURL||row['投稿URL']||row.link||'https://www.instagram.com/onakaguguchan/';
let img=processImageUrl(row.image||row.image_url||row['画像']||'',postUrl);
if(!img||img==='https://www.instagram.com/onakaguguchan/'){
img='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&auto=format&fit=crop';
}
const gmap=row.googleMap||row.google_map||row['Googleマップ']||
`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' 富山')}`;
const lat=parseFloat(String(row.lat||row['緯度']||'').replace(/[^\d.]/g,''));
const lng=parseFloat(String(row.lng||row['経度']||'').replace(/[^\d.]/g,''));
if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;
return{
id:idx,name,
desc:row.description||row['詳細']||row['説明']||'おいしい噂を聞きつけて調査中！',
category:row.category||row['カテゴリ']||'グルメ',
instaKw:String(kw).trim(),
gmapUrl:gmap,postUrl,imgUrl:img,lat,lng
};
}).filter(Boolean);
applyFilterAndDraw();
}catch(error){console.error('CSV読み込みエラー:',error)}
},
error:error=>console.error('CSV取得エラー:',error)
});

function applyFilterAndDraw(){
let result=[...spotsData];
if(currentSearchVal){
const q=currentSearchVal.trim().toLowerCase();
result=result.filter(s=>
s.name.toLowerCase().includes(q)||
s.instaKw.toLowerCase().includes(q)||
s.category.toLowerCase().includes(q)||
s.desc.toLowerCase().includes(q)
);
}
if(currentFilterCat!=='all'){
result=result.filter(s=>s.category.includes(currentFilterCat));
}
if(currentSortMode==='distance'&&userLatLng){
result.sort((a,b)=>
calculateRawDistance(userLatLng.lat,userLatLng.lng,a.lat,a.lng)-
calculateRawDistance(userLatLng.lat,userLatLng.lng,b.lat,b.lng)
);
}else if(currentSortMode==='likes'){
result.sort((a,b)=>(likeCounts[b.name]||0)-(likeCounts[a.name]||0));
}
drawMarkers(result);
}

function drawMarkers(data){
markerGroup.clearLayers();
const listEl=document.getElementById('spotList');
listEl.innerHTML='';
if(data.length===0){
listEl.innerHTML='<p class="text-orange-800/60 font-bold text-center py-4 text-xs">お店が見つからなかった！</p>';
return;
}
const myLikes=getMyLikes();
let activeMarker=null;

data.forEach(s=>{
const style=getCategoryStyle(s.category);
const count=likeCounts[s.name]||0;
const liked=!!myLikes[s.name];
const instaUrl=`https://www.instagram.com/explore/tags/${encodeURIComponent(s.instaKw)}/`;
const distance=userLatLng?
`📍 現在地から ${formatDistanceText(calculateRawDistance(userLatLng.lat,userLatLng.lng,s.lat,s.lng))}`:'';

const popup=`
<div class="bg-white rounded-xl overflow-hidden shadow-sm">
<div class="relative w-full aspect-[3/4] bg-slate-900 overflow-hidden">
<img src="${s.imgUrl}" loading="lazy" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300'">
<span class="absolute top-1.5 left-1.5 text-[9px] font-black px-2 py-0.5 rounded-full text-white" style="background:${style.color}">${style.emoji} ${s.category}</span>
<button onclick="closeMyPopup()" class="absolute top-1.5 right-1.5 z-30 w-6 h-6 bg-red-500 text-white rounded-full">✖</button>
</div>
<div class="p-2 space-y-1 bg-white">
<div class="flex items-center justify-between">
<h3 class="font-black text-gray-900 text-xs truncate flex-1">${s.name}</h3>
<button onclick="toggleLike(${JSON.stringify(s.name)},event)" class="px-2 py-0.5 rounded-lg text-[9px] font-black ${liked?'bg-red-500 text-white':'bg-gray-100 text-gray-700'}">
❤️ ${count}
</button>
</div>
${distance?`<p class="text-[8px] text-orange-600 font-extrabold">${distance}</p>`:''}
<p class="text-[10px] text-gray-700 font-bold bg-amber-50 p-1 rounded-lg">💬 ${s.desc}</p>
<a href="${s.postUrl}" target="_blank" rel="noopener" class="block text-center p-1 bg-gradient-to-r from-purple-600 to-pink-500 text-white text-[10px] font-black rounded-lg">Instagram投稿を見る</a>
<div class="grid grid-cols-2 gap-1">
<a href="${instaUrl}" target="_blank" rel="noopener" class="insta-btn text-center text-white text-[8px] rounded-md p-1">みんなの投稿</a>
<a href="${s.gmapUrl}" target="_blank" rel="noopener" class="bg-emerald-600 text-center text-white text-[8px] rounded-md p-1">Google Map</a>
</div>
</div>
</div>`;

const icon=L.divIcon({
className:'custom-pin-wrapper',
html:`<div class="custom-food-pin" style="background:${style.color}">${style.emoji}</div>`,
iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-10]
});

const marker=L.marker([s.lat,s.lng],{icon}).bindPopup(popup,{autoPan:true,autoPanPadding:[50,50]});
marker.on('popupopen',()=>openPopupSpotName=s.name);
if(openPopupSpotName===s.name)activeMarker=marker;
markerGroup.addLayer(marker);

const card=document.createElement('div');
card.className='bg-white p-2 border-2 border-orange-100 rounded-xl hover:border-orange-300 transition cursor-pointer flex gap-2 items-center relative overflow-hidden';
const image=document.createElement('img');
image.src=s.imgUrl;
image.loading='lazy';
image.className='w-12 aspect-[3/4] object-cover rounded-lg border border-amber-100 flex-shrink-0';
image.onerror=()=>image.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300';

const info=document.createElement('div');
info.className='flex-1 min-w-0';
info.innerHTML=`
<div class="flex justify-between items-start gap-1">
<h4 class="font-black text-gray-800 text-xs truncate">${s.name}</h4>
<span class="text-[8px] font-black px-1.5 py-0.5 rounded-full text-white whitespace-nowrap" style="background:${style.color}">${style.emoji} ${s.category}</span>
</div>
<p class="text-[9px] text-gray-500 font-bold truncate mt-0.5">${s.desc}</p>
<div class="flex items-center justify-between mt-1">
<span class="text-[8px] font-black text-orange-600">${distance}</span>
<button class="like-button text-[9px] font-black ${liked?'text-white bg-red-500':'text-red-500 bg-red-50'} px-2 py-1 rounded-full border border-red-100">❤️ ${count}</button>
</div>`;
info.querySelector('.like-button').addEventListener('click',e=>toggleLike(s.name,e));
card.append(image,info);
card.addEventListener('click',()=>{
myMap.invalidateSize();
myMap.setView([s.lat,s.lng],15,{animate:true});
setTimeout(()=>{
openPopupSpotName=s.name;
marker.openPopup();
},400);
if(window.innerWidth<768){
sheet.style.height='90px';
currentMode='min';
setTimeout(()=>myMap.invalidateSize(),250);
}
});
listEl.appendChild(card);
});

if(activeMarker)activeMarker.openPopup();
}

document.getElementById('searchInput').addEventListener('input',e=>{
currentSearchVal=e.target.value.toLowerCase();
applyFilterAndDraw();
});

function filterCategory(cat,button){
currentFilterCat=cat;
document.querySelectorAll('.cat-btn').forEach(b=>{
b.classList.remove('bg-orange-500','text-white','font-black');
b.classList.add('bg-white','text-orange-900');
});
button.classList.remove('bg-white','text-orange-900');
button.classList.add('bg-orange-500','text-white','font-black');
applyFilterAndDraw();
}

function setSortMode(mode,button){
if(mode==='distance'&&!userLatLng){
alert('現在地が取得されていません！右上の「現在地」ボタンを押してね！');
return;
}
currentSortMode=mode;
document.querySelectorAll('.sort-btn').forEach(b=>{
b.classList.remove('bg-orange-500','text-white','font-black');
b.classList.add('bg-amber-100','text-amber-900');
});
button.classList.remove('bg-amber-100','text-amber-900');
button.classList.add('bg-orange-500','text-white','font-black');
applyFilterAndDraw();
}

function getLocation(){myMap.locate({setView:true,maxZoom:15})}

myMap.on('locationfound',e=>{
userLatLng=e.latlng;
if(userMarker)myMap.removeLayer(userMarker);
const icon=L.divIcon({
html:'<div class="w-6 h-6 rounded-full bg-red-500 border-2 border-white shadow-lg flex items-center justify-center text-white text-[9px]">📍</div>',
iconSize:[24,24],iconAnchor:[12,12]
});
userMarker=L.marker(e.latlng,{icon}).addTo(myMap).bindPopup('📍 現在地');
currentSortMode='distance';
document.querySelectorAll('.sort-btn').forEach(b=>{
b.classList.remove('bg-orange-500','text-white','font-black');
b.classList.add('bg-amber-100','text-amber-900');
});
const distanceButton=document.querySelectorAll('.sort-btn')[1];
distanceButton.classList.remove('bg-amber-100','text-amber-900');
distanceButton.classList.add('bg-orange-500','text-white','font-black');
applyFilterAndDraw();
});

myMap.on('locationerror',()=>{
alert('現在地を取得できませんでした。スマホの位置情報を許可してね！');
});
</script>
</body>
</html>
