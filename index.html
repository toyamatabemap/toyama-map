<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
// ==========================================
// Firebase設定
// ==========================================

const firebaseConfig = {
 apiKey:"AIzaSyCokjVZVcnwDt1inWLUCfoDnPzQ7M5Y-G4",
 authDomain:"toyamap-dcb68.firebaseapp.com",
 projectId:"toyamap-dcb68",
 storageBucket:"toyamap-dcb68.firebasestorage.app",
 messagingSenderId:"502642575813",
 appId:"1:502642575813:web:c7e9fa0050e074d3c6e3ac"
};

let db = null;
let auth = null;
let currentUser = null;

try {
 if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
 db = firebase.firestore();
 auth = firebase.auth();
} catch(e) {
 console.error("Firebase初期化エラー",e);
}

// ==========================================
// マップ
// ==========================================

const myMap = L.map('map',{zoomControl:false})
 .setView([36.6953,137.2113],11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 attribution:'&copy; OpenStreetMap'
}).addTo(myMap);

L.control.attribution({position:'topleft'}).addTo(myMap);

let markerGroup = L.layerGroup().addTo(myMap);
let spotsData = [];
let likeCounts = {};
let myLikes = {};
let userLatLng = null;
let userMarker = null;
let currentFilterCat = 'all';
let currentSearchVal = '';
let currentSortMode = 'default';
let openPopupSpotName = null;
let likeBusy = new Set();

const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXXOH9pKDeiSNg8G0FJcKKmH7Ttio5iq10frKSvzUISdVlGLUt0k301QfhnFfxoJmdQFkvdo5d520s/pub?output=csv';

// ==========================================
// 店舗ID：名前を元に安定したIDを生成
// ==========================================

function spotId(name) {
 return encodeURIComponent(String(name).trim());
}

function escapeHTML(value) {
 return String(value ?? '').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 })[c]);
}

function getMyLikes() {
 return myLikes;
}

// ==========================================
// 匿名ログイン
// 同じ端末・ブラウザでは同じユーザーIDを維持
// ==========================================

function initializeAuth() {
 if (!auth) return;

 auth.onAuthStateChanged(async user => {
  if (user) {
   currentUser = user;
   await loadMyLikes();
  } else {
   try {
    await auth.signInAnonymously();
   } catch(e) {
    console.error("匿名ログイン失敗",e);
    alert("ログインに失敗しました。Firebase Authenticationの匿名ログインを有効にしてください。");
   }
  }
 });
}

// ==========================================
// 自分のいいね状態をFirestoreから取得
// ==========================================

async function loadMyLikes() {
 if (!db || !currentUser) return;

 try {
  const snapshot = await db.collection('userLikes')
   .doc(currentUser.uid).collection('spots').get();

  myLikes = {};
  snapshot.forEach(doc=>{
   if (doc.data().liked === true) myLikes[doc.id] = true;
  });

  applyFilterAndDraw();
 } catch(e) {
  console.error("自分のいいね取得エラー",e);
 }
}

// ==========================================
// 全店舗のいいね数をリアルタイム監視
// ==========================================

function listenLikeCounts() {
 if (!db) return;

 db.collection('likes').onSnapshot(snapshot=>{
  likeCounts = {};

  snapshot.forEach(doc=>{
   const data = doc.data();
   likeCounts[doc.id] = Number(data.count || 0);
  });

  applyFilterAndDraw();
 },err=>{
  console.error("いいね数の同期エラー",err);
 });
}

// ==========================================
// いいね切り替え
// ==========================================

async function toggleLike(name,event) {
 if (event) {
  event.preventDefault();
  event.stopPropagation();
  if (event.stopImmediatePropagation) event.stopImmediatePropagation();
 }

 if (!db || !currentUser) {
  alert("現在ログイン処理中です。少し待ってからもう一度押してください。");
  return;
 }

 const id = spotId(name);

 if (likeBusy.has(id)) return;
 likeBusy.add(id);

 const button = event?.currentTarget;
 if (button) button.disabled = true;

 const userRef = db.collection('userLikes')
  .doc(currentUser.uid).collection('spots').doc(id);

 const countRef = db.collection('likes').doc(id);

 try {
  await db.runTransaction(async transaction=>{
   const userDoc = await transaction.get(userRef);
   const countDoc = await transaction.get(countRef);

   const wasLiked = userDoc.exists && userDoc.data().liked === true;
   const nextCount = Math.max(
    0,
    Number(countDoc.exists ? countDoc.data().count || 0 : 0)
    + (wasLiked ? -1 : 1)
   );

   if (wasLiked) {
    transaction.delete(userRef);
   } else {
    transaction.set(userRef,{
     liked:true,
     spotName:name,
     updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
   }

   transaction.set(countRef,{
    count:nextCount,
    spotName:name,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
   },{merge:true});
  });

  myLikes[id] = !myLikes[id];
  applyFilterAndDraw();

 } catch(e) {
  console.error("いいね更新エラー",e);
  alert("いいねを更新できませんでした。通信状況とFirestoreのルールを確認してください。");
 } finally {
  likeBusy.delete(id);
  if (button) button.disabled = false;
 }
}

// ==========================================
// 画像URL処理
// ==========================================

function processImageUrl(url,postUrl) {
 let value = url || postUrl || '';

 if (value.includes('drive.google.com')) {
  const m = value.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/uc?export=view&id=${m[1]}`;
 }

 return value || 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600';
}

// ==========================================
// カテゴリ表示
// ==========================================

function getCategoryStyle(cat) {
 const styles=[
 ['ラーメン','#EF4444','🍜'],
 ['カレー','#D97706','🍛'],
 ['肉ご飯','#DC2626','🥩'],
 ['魚ご飯','#0284C7','🐟'],
 ['洋食','#F59E0B','🍳'],
 ['中華','#EA580C','🥟'],
 ['和食','#16A34A','🍱'],
 ['カフェ','#B45309','☕'],
 ['ケーキ屋','#EC4899','🍰'],
 ['和菓子屋','#84CC16','🍡'],
 ['軽食','#14B8A6','🥪'],
 ['バー','#4C1D95','🍸'],
 ['居酒屋','#B91C1C','🍻'],
 ['ドライブ','#7C3AED','🚗'],
 ['食べ放題','#059669','🍽️']
 ];
 const s=styles.find(x=>cat?.includes(x[0]));
 return s?{color:s[1],emoji:s[2]}:{color:'#F97316',emoji:'😋'};
}

// ==========================================
// 距離計算
// ==========================================

function calculateDistance(lat1,lon1,lat2,lon2) {
 const R=6371;
 const dLat=(lat2-lat1)*Math.PI/180;
 const dLon=(lon2-lon1)*Math.PI/180;
 const a=Math.sin(dLat/2)**2+
 Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
 Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function formatDistance(km) {
 return km<1?Math.round(km*1000)+'m':km.toFixed(1)+'km';
}

// ==========================================
// CSV読み込み
// ==========================================

Papa.parse(csvUrl,{
 download:true,
 header:true,
 skipEmptyLines:true,
 complete:res=>{
  spotsData=res.data.map((row,idx)=>{
   const name=row.name||row['名称']||row['名前']||'';
   if(!name) return null;

   const rawLat=String(row.lat||row['緯度']||'').replace(/[^\d.-]/g,'');
   const rawLng=String(row.lng||row['経度']||'').replace(/[^\d.-]/g,'');

   const lat=parseFloat(rawLat);
   const lng=parseFloat(rawLng);

   if(!Number.isFinite(lat)||!Number.isFinite(lng)) return null;

   const postUrl=row.postUrl||row.postURL||row['投稿URL']||row.link||'https://www.instagram.com/onakaguguchan/';
   const image=row.image||row.image_url||row['画像']||'';
   const instaKw=row.instaKeyword||row.instaKetword||row['ハッシュタグ']||name;
   const gmap=row.googleMap||row.google_map||row['Googleマップ']||
    `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' 富山')}`;

   return {
    id:idx,
    name:name.trim(),
    desc:row.description||row['詳細']||row['説明']||'おいしい噂を聞きつけて調査中！',
    category:row.category||row['カテゴリ']||'グルメ',
    instaKw:String(instaKw).trim(),
    postUrl,
    imgUrl:processImageUrl(image,postUrl),
    gmapUrl:gmap,
    lat,lng
   };
  }).filter(Boolean);

  applyFilterAndDraw();
 },
 error:err=>{
  console.error("CSV読み込みエラー",err);
  document.getElementById('spotList').innerHTML='店舗データを読み込めませんでした。';
 }
});

// ==========================================
// 描画
// ==========================================

function applyFilterAndDraw() {
 let result=[...spotsData];

 if(currentSearchVal) {
  const q=currentSearchVal.toLowerCase();
  result=result.filter(s=>
   s.name.toLowerCase().includes(q)||
   s.category.toLowerCase().includes(q)||
   s.desc.toLowerCase().includes(q)||
   s.instaKw.toLowerCase().includes(q)
  );
 }

 if(currentFilterCat!=='all') {
  result=result.filter(s=>s.category.includes(currentFilterCat));
 }

 if(currentSortMode==='likes') {
  result.sort((a,b)=>(likeCounts[spotId(b.name)]||0)-(likeCounts[spotId(a.name)]||0));
 }

 if(currentSortMode==='distance'&&userLatLng) {
  result.sort((a,b)=>
   calculateDistance(userLatLng.lat,userLatLng.lng,a.lat,a.lng)-
   calculateDistance(userLatLng.lat,userLatLng.lng,b.lat,b.lng)
  );
 }

 drawMarkers(result);
}

function drawMarkers(data) {
 markerGroup.clearLayers();
 const list=document.getElementById('spotList');
 list.innerHTML='';

 if(!data.length) {
  list.innerHTML='<p class="text-center text-gray-500 py-8 text-xs">お店が見つかりませんでした。</p>';
  return;
 }

 data.forEach(s=>{
  const id=spotId(s.name);
  const count=likeCounts[id]||0;
  const liked=!!myLikes[id];
  const style=getCategoryStyle(s.category);
  const distance=userLatLng?
   '📍 '+formatDistance(calculateDistance(userLatLng.lat,userLatLng.lng,s.lat,s.lng)):'';

  const pin=L.divIcon({
   className:'',
   html:`<div class="custom-food-pin" style="background:${style.color}">${style.emoji}</div>`,
   iconSize:[30,30],iconAnchor:[15,15]
  });

  const popup=`
   <div class="bg-white">
    <div class="photo-frame">
     <img src="${escapeHTML(s.imgUrl)}" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600'">
    </div>
    <div class="p-3 space-y-2">
     <div class="flex justify-between items-center gap-2">
      <b class="text-sm text-gray-900">${escapeHTML(s.name)}</b>
      <button class="like-btn text-xs px-3 py-2 rounded-full ${liked?'bg-red-500 text-white':'bg-red-50 text-red-500'}"
       onclick="toggleLike('${escapeHTML(s.name)}',event)">
       ❤️ <span>${count}</span>
      </button>
     </div>
     <p class="text-xs text-gray-600">${escapeHTML(s.desc)}</p>
     <a target="_blank" href="${escapeHTML(s.postUrl)}"
      class="block text-center bg-gradient-to-r from-purple-600 to-pink-500 text-white font-black text-xs rounded-lg p-2">
      <i class="fa-brands fa-instagram"></i> Instagram投稿を見る
     </a>
     <div class="grid grid-cols-2 gap-2">
      <a target="_blank" href="https://www.instagram.com/explore/tags/${encodeURIComponent(s.instaKw)}/"
       class="insta-btn text-center text-white text-xs font-black rounded-lg p-2">みんなの投稿</a>
      <a target="_blank" href="${escapeHTML(s.gmapUrl)}"
       class="bg-emerald-600 text-center text-white text-xs font-black rounded-lg p-2">Google Map</a>
     </div>
    </div>
   </div>`;

  const marker=L.marker([s.lat,s.lng],{icon:pin}).bindPopup(popup,{
   autoPan:true,autoPanPadding:[40,40]
  });

  marker.on('popupopen',()=>openPopupSpotName=s.name);
  markerGroup.addLayer(marker);

  const card=document.createElement('div');
  card.className='flex gap-3 p-2 border-2 border-orange-100 rounded-xl cursor-pointer bg-white';

  card.innerHTML=`
   <div class="w-20 flex-shrink-0 photo-frame rounded-lg">
    <img src="${escapeHTML(s.imgUrl)}" loading="lazy"
     onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300'">
   </div>
   <div class="flex-1 min-w-0 flex flex-col justify-between">
    <div>
     <div class="font-black text-xs text-gray-900">${escapeHTML(s.name)}</div>
     <div class="text-[10px] text-orange-600 font-bold">${escapeHTML(s.category)}</div>
     <p class="text-[10px] text-gray-500 truncate">${escapeHTML(s.desc)}</p>
    </div>
    <div class="flex justify-between items-center mt-2">
     <span class="text-[10px] text-gray-500">${distance}</span>
     <button type="button"
      class="like-btn px-3 py-1 rounded-full text-xs font-black ${liked?'bg-red-500 text-white':'bg-red-50 text-red-500'}"
      onclick="toggleLike('${escapeHTML(s.name)}',event)">
      ❤️ <span>${count}</span>
     </button>
    </div>
   </div>`;

  card.addEventListener('click',()=>{
   myMap.setView([s.lat,s.lng],15);
   setTimeout(()=>marker.openPopup(),300);
   if(window.innerWidth<768) {
    document.getElementById('bottomSheet').style.height='90px';
   }
  });

  list.appendChild(card);
 });

 if(openPopupSpotName) {
  const selected=data.find(s=>s.name===openPopupSpotName);
  if(selected) {
   // ポップアップは再描画時に必要なら再度開く
   markerGroup.eachLayer(marker=>{
    const ll=marker.getLatLng();
    if(ll.lat===selected.lat&&ll.lng===selected.lng) marker.openPopup();
   });
  }
 }
}

// ==========================================
// 検索・カテゴリ・ソート
// ==========================================

document.getElementById('searchInput').addEventListener('input',e=>{
 currentSearchVal=e.target.value.trim().toLowerCase();
 applyFilterAndDraw();
});

function filterCategory(cat,button) {
 currentFilterCat=cat;
 document.querySelectorAll('.cat-btn').forEach(b=>{
  b.className='cat-btn bg-white text-orange-900 border px-3 py-1 rounded-full whitespace-nowrap';
 });
 button.className='cat-btn bg-orange-500 text-white px-3 py-1 rounded-full whitespace-nowrap';
 applyFilterAndDraw();
}

function setSortMode(mode,button) {
 if(mode==='distance'&&!userLatLng) {
  alert('先に現在地を取得してください。');
  return;
 }
 currentSortMode=mode;
 document.querySelectorAll('.sort-btn').forEach(b=>{
  b.className='sort-btn bg-white text-orange-900 px-2 py-1 rounded';
 });
 button.className='sort-btn bg-orange-500 text-white px-2 py-1 rounded';
 applyFilterAndDraw();
}

// ==========================================
// 現在地
// ==========================================

function getLocation() {
 myMap.locate({setView:true,maxZoom:15});
}

myMap.on('locationfound',e=>{
 userLatLng=e.latlng;
 if(userMarker) myMap.removeLayer(userMarker);
 userMarker=L.marker(e.latlng).addTo(myMap)
  .bindPopup('📍 現在地');
 if(currentSortMode==='distance') applyFilterAndDraw();
});

myMap.on('locationerror',()=>{
 alert('位置情報を取得できませんでした。');
});

// ==========================================
// ボトムシート
// ==========================================

const sheet=document.getElementById('bottomSheet');
const drag=document.getElementById('dragHeader');
let startY=0,startHeight=0;

drag.addEventListener('touchstart',e=>{
 startY=e.touches[0].clientY;
 startHeight=sheet.offsetHeight;
},{passive:true});

drag.addEventListener('touchend',e=>{
 const delta=startY-e.changedTouches[0].clientY;
 sheet.style.height=delta>40?'85vh':delta< -40?'90px':'50vh';
 setTimeout(()=>myMap.invalidateSize(),300);
});

// ==========================================
// Firebase起動
// ==========================================

initializeAuth();
listenLikeCounts();

</script>
</body>
</html>
